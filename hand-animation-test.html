<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Scroll Animation Test</title>
    <style>
      :root {
        color-scheme: light;
        background: #f4f3ed;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f4f3ed;
      }

      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
      }

      .scroll-track {
        height: 200vh;
      }

      .sticky-stage {
        position: sticky;
        top: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #f4f3ed;
      }

      .hand-frame {
        position: absolute;
        right: 0;
        left: 0;
        bottom: 0;
        display: block;
        width: min(100vw, 1920px);
        height: auto;
        max-height: 100vh;
        margin-inline: auto;
        object-fit: contain;
        object-position: bottom center;
        image-rendering: auto;
        transform: translateY(42vh);
        will-change: transform;
      }

      .hand-frame.is-entering {
        transform: translateY(0);
        transition: transform 900ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .hand-frame.is-settled {
        transform: none;
        transition: none;
        will-change: auto;
      }

      .debug-panel {
        position: fixed;
        z-index: 1;
        top: 16px;
        left: 16px;
        margin: 0;
        padding: 10px 12px;
        color: #17455d;
        background: rgb(244 243 237 / 88%);
        border: 1px solid rgb(23 69 93 / 18%);
        font-size: 13px;
        line-height: 1.55;
        pointer-events: none;
      }

    </style>
  </head>
  <body>
    <main class="scroll-track" aria-label="Hand scroll animation test">
      <section class="sticky-stage">
        <img
          id="hand-frame"
          class="hand-frame"
          src="public/assets/hands/hand_01.webp"
          width="1920"
          height="1080"
          alt="Hands opening from a fist"
          draggable="false"
        />
      </section>
    </main>

    <p class="debug-panel" aria-live="polite">
      Frame: <span id="frame-value">01 / 20</span><br />
      Scroll Progress: <span id="progress-value">0%</span>
    </p>

    <script>
      (() => {
        const FRAME_COUNT = 20;
        const FRAME_ROOT = "public/assets/hands";
        const SMOOTHING_FACTOR = 0.12;
        const MAX_PROGRESS_STEP = 1 / (FRAME_COUNT - 1);
        const SETTLE_EPSILON = 0.0001;
        const frameElement = document.querySelector("#hand-frame");
        const frameValue = document.querySelector("#frame-value");
        const progressValue = document.querySelector("#progress-value");

        const frameSources = Array.from({ length: FRAME_COUNT }, (_, index) => {
          const number = String(index + 1).padStart(2, "0");
          return `${FRAME_ROOT}/hand_${number}.webp`;
        });

        // Keep all Image objects alive so decoded frames remain available while
        // the fixed display element switches src without creating DOM nodes.
        const preloadedFrames = frameSources.map((source) => {
          const image = new Image();
          image.src = source;
          return image;
        });

        let currentFrameIndex = 0;
        let targetProgress = 0;
        let currentProgress = 0;
        let scrubFrameId = null;
        let introComplete = false;

        function getScrollProgress() {
          const scrollRange = document.documentElement.scrollHeight - window.innerHeight;
          if (scrollRange <= 0) return 0;
          return Math.min(1, Math.max(0, window.scrollY / scrollRange));
        }

        function renderFrame(progress) {
          const nextFrameIndex = Math.round(progress * (FRAME_COUNT - 1));

          if (nextFrameIndex !== currentFrameIndex) {
            currentFrameIndex = nextFrameIndex;
            frameElement.src = frameSources[currentFrameIndex];
            frameValue.textContent = `${String(currentFrameIndex + 1).padStart(2, "0")} / 20`;
          }
        }

        function scrubTowardTarget() {
          scrubFrameId = null;
          const difference = targetProgress - currentProgress;

          if (Math.abs(difference) <= SETTLE_EPSILON) {
            currentProgress = targetProgress;
            renderFrame(currentProgress);
            return;
          }

          // Lerp toward the latest scroll target. Capping the progress step at
          // one frame interval prevents rapid wheel input from skipping frames.
          const lerpedStep = difference * SMOOTHING_FACTOR;
          const progressStep =
            Math.sign(lerpedStep) *
            Math.min(Math.abs(lerpedStep), MAX_PROGRESS_STEP);
          currentProgress = Math.min(
            1,
            Math.max(0, currentProgress + progressStep),
          );
          renderFrame(currentProgress);
          scrubFrameId = window.requestAnimationFrame(scrubTowardTarget);
        }

        function requestScrub() {
          targetProgress = getScrollProgress();
          progressValue.textContent = `${Math.round(targetProgress * 100)}%`;
          if (!introComplete || scrubFrameId !== null) return;
          scrubFrameId = window.requestAnimationFrame(scrubTowardTarget);
        }

        function startEntrance() {
          // Start from a committed below-viewport position, then move frame 01
          // into place. Remove the transform afterward for maximum sharpness.
          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(() => {
              frameElement.classList.add("is-entering");
            });
          });
        }

        frameElement.addEventListener(
          "transitionend",
          (event) => {
            if (event.propertyName === "transform") {
              frameElement.classList.add("is-settled");
              introComplete = true;
              requestScrub();
            }
          },
          { once: true },
        );

        // Bind scrolling and begin the entrance only after all 20 lossless WebP
        // frames have loaded and decoded into the browser cache.
        Promise.all(
          preloadedFrames.map(
            (image) =>
              new Promise((resolve, reject) => {
                if (image.complete && image.naturalWidth > 0) {
                  resolve(image);
                  return;
                }
                image.addEventListener("load", () => resolve(image), { once: true });
                image.addEventListener("error", reject, { once: true });
              }),
          ),
        )
          .then((images) =>
            Promise.all(images.map((image) => image.decode().catch(() => undefined))),
          )
          .then(() => {
            window.addEventListener("scroll", requestScrub, { passive: true });
            window.addEventListener("resize", requestScrub);
            console.info(`Preloaded ${FRAME_COUNT} hand animation frames.`);
            targetProgress = getScrollProgress();
            progressValue.textContent = `${Math.round(targetProgress * 100)}%`;
            startEntrance();
          })
          .catch((error) => {
            console.error("Hand frame preload failed.", error);
          });
      })();
    </script>
  </body>
</html>
