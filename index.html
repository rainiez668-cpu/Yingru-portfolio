<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Fragment Prototype</title>
  <link rel="stylesheet" href="site-chrome.css" />
  <style>
    :root {
      color-scheme: light;
      background: var(--site-background);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--site-background);
    }

    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", monospace;
    }

    .scroll-track {
      height: 200vh;
    }

    .sticky-stage {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: var(--site-background);
    }

    .hand-frame {
      position: absolute;
      right: 0;
      left: 0;
      bottom: 0;
      display: block;
      width: min(100vw, 1286px, 177.777778vh);
      aspect-ratio: 1920 / 1080;
      max-height: 100vh;
      margin-inline: auto;
      transform: translateY(42vh);
      will-change: transform;
    }

    .hand-frame__image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      visibility: hidden;
      object-fit: contain;
      object-position: bottom center;
      image-rendering: auto;
    }

    .hand-frame__image.is-active {
      visibility: visible;
    }

    .hand-frame.is-entering {
      transform: translateY(0);
      transition: transform 900ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .hand-frame.is-settled {
      transform: none;
      transition: none;
      will-change: auto;
    }

    .display-name {
      position: absolute;
      z-index: 3;
      top: calc(clamp(25px, 6vh, 50px) - 19px);
      left: clamp(25px, 5vw, 51px);
      display: flex;
      flex-direction: column;
      width: fit-content;
      margin: 0;
      color: var(--site-blue);
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      font-size: clamp(50px, 7.4vw, 76px);
      font-style: normal;
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.055em;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-140%);
      will-change: transform, opacity;
    }

    .display-name.is-entering {
      opacity: 1;
      transform: translateY(0);
      transition:
        transform 900ms cubic-bezier(0.22, 1, 0.36, 1) 100ms,
        opacity 280ms ease-out 100ms;
    }

    .display-name-line {
      width: 100%;
      white-space: nowrap;
    }

    .display-name-line--top {
      position: relative;
      transform: translateY(-7px);
    }

    .display-name-line--top::before {
      content: "Yingru";
      display: block;
      visibility: hidden;
    }

    .display-name-primary {
      position: absolute;
      inset: 0;
    }

    .display-name.has-art-y .display-name-primary::first-letter {
      color: #beeb4f;
      font-family: "Pinyon Script", "Snell Roundhand", "Brush Script MT", cursive;
      font-size: 1.4286em;
      font-weight: 400;
    }

    .display-name-line--bottom {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-top: 0.06em;
    }

    .display-name-secondary {
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      font-size: 0.94em;
      font-style: normal;
      font-weight: 400;
      letter-spacing: -0.055em;
      transform: translate(0px, -3px);
    }

    .home-navigation {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 600ms ease,
        visibility 0s linear 600ms;
    }

    .home-navigation.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 600ms ease;
    }

    .top-navigation-rule {
      position: absolute;
      z-index: 3;
      top: calc(clamp(75px, 13.33vh, 111px) - 19px);
      right: clamp(32px, 4.167vw, 64px);
      left: clamp(127px, 21.1vw, 326px);
      height: 1.34px;
      background: var(--site-blue);
      opacity: 0;
      transform: translateY(-140%) rotate(0.2deg);
      transform-origin: right center;
      will-change: transform, opacity;
    }

    .top-navigation-rule.is-entering {
      opacity: 1;
      transform: translateY(0) rotate(0.2deg);
      transition:
        transform 1200ms cubic-bezier(0.22, 1, 0.36, 1) 100ms,
        opacity 1000ms ease-out 100ms;
    }

    @media (max-width: 600px) {
      .display-name {
        font-size: clamp(42px, 18vw, 59px);
        line-height: 0.9;
      }
    }

    .scroll-hint {
      position: absolute;
      z-index: 3;

      left: 50%;
      top: 50%;
      bottom: auto;

      color: #65bceb;
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB",
        "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;

      font-size: 11px;
      font-weight: 400;
      line-height: 1.225;
      letter-spacing: 1.13px;

      opacity: 0;
      pointer-events: none;

      transform: translate(-50%, 3px);
    }

    .scroll-hint.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
      transition:
        opacity 400ms ease,
        transform 400ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .scroll-hint.is-consumed {
      opacity: 0;
      transform: translate(-50%, 2px);
      transition:
        opacity 300ms ease,
        transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .scroll-hint__text {
      white-space: nowrap;
    }

    .scroll-hint__eyebrow {
      display: block;
      margin-bottom: 2px;
      color: inherit;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
    }

    .scroll-hint__arrow {
      display: inline-block;
      margin-left: 0;
      color: inherit;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
      opacity: 0;
      transition: opacity 280ms ease;
    }

    .scroll-hint__arrow.is-visible {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .scroll-hint {
        bottom: 28px;
        font-size: 13px;
        letter-spacing: 0.08em;
      }

      .top-navigation-rule {
        top: 62px;
        right: 38px;
        left: 38px;
      }
    }

    .fragment-layer,
    .debug-markers {
      position: absolute;
      z-index: 2;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .fragment-group {
      position: absolute;
      inset: 0;
    }

    .symbol-glow {
      --glow-scale: 1;
      position: absolute;
      z-index: 1;
      top: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(var(--glow-scale));
      transform-origin: 50% 50%;
      will-change: opacity;
    }

    .four-point-glow {
      width: 300px;
      height: 350px;
    }

    .four-point-glow::before,
    .four-point-glow::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      filter: blur(22px);
      transform: translate(-50%, -50%);
    }

    .four-point-glow::before {
      width: 46px;
      height: 304px;
      background: radial-gradient(ellipse at center,
          rgb(217 245 106 / 42%) 0%,
          rgb(190 235 79 / 30%) 38%,
          rgb(174 234 85 / 0%) 78%);
    }

    .four-point-glow::after {
      width: 272px;
      height: 44px;
      background: radial-gradient(ellipse at center,
          rgb(217 245 106 / 38%) 0%,
          rgb(190 235 79 / 27%) 40%,
          rgb(174 234 85 / 0%) 80%);
    }

    .symbol-glow__core {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: radial-gradient(circle at center,
          rgb(217 245 106 / 58%) 0%,
          rgb(190 235 79 / 32%) 42%,
          rgb(174 234 85 / 0%) 76%);
      filter: blur(11px);
      transform: translate(-50%, -50%);
    }

    .lab-five-glow {
      width: 220px;
      height: 210px;
      transform: translate(-50%, -50%) rotate(20deg) scale(var(--glow-scale));
    }

    .lab-five-glow::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 50%;
      left: 50%;
      width: 172px;
      height: 156px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 52%,
          rgb(217 245 106 / 50%) 0%,
          rgb(190 235 79 / 36%) 30%,
          rgb(174 234 85 / 20%) 52%,
          rgb(174 234 85 / 8%) 68%,
          rgb(174 234 85 / 0%) 86%);
      filter: blur(16px);
      transform: translate(-50%, -50%);
    }

    .lab-glow-node {
      position: absolute;
      z-index: 1;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: radial-gradient(circle at center,
          rgb(217 245 106 / 35%) 0%,
          rgb(190 235 79 / 20%) 42%,
          rgb(174 234 85 / 0%) 78%);
      filter: blur(20px);
      transform: translate(-50%, -50%);
    }

    .lab-glow-node:nth-child(1) {
      top: 10%;
      left: 50%;
    }

    .lab-glow-node:nth-child(2) {
      top: 39%;
      left: 82%;
    }

    .lab-glow-node:nth-child(3) {
      top: 79%;
      left: 70%;
    }

    .lab-glow-node:nth-child(4) {
      top: 79%;
      left: 30%;
    }

    .lab-glow-node:nth-child(5) {
      top: 39%;
      left: 18%;
    }

    .lab-glow-node:nth-child(6) {
      top: 53%;
      left: 50%;
      width: 70px;
      height: 70px;
      background: radial-gradient(circle at center,
          rgb(217 245 106 / 58%) 0%,
          rgb(190 235 79 / 32%) 42%,
          rgb(174 234 85 / 0%) 76%);
      filter: blur(11px);
    }

    .work-main-glow {
      width: 260px;
      height: 250px;
    }

    .work-main-glow::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 52%,
          rgb(217 245 106 / 50%) 0%,
          rgb(190 235 79 / 36%) 30%,
          rgb(174 234 85 / 20%) 52%,
          rgb(174 234 85 / 8%) 68%,
          rgb(174 234 85 / 0%) 86%);
      filter: blur(18px);
      transform: translate(-50%, -50%);
    }

    .work-glow-node {
      position: absolute;
      z-index: 1;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at center,
          rgb(217 245 106 / 36%) 0%,
          rgb(190 235 79 / 21%) 42%,
          rgb(174 234 85 / 0%) 78%);
      filter: blur(21px);
      transform: translate(-50%, -50%);
    }

    .work-glow-node:nth-child(1) {
      top: 12%;
      left: 50%;
    }

    .work-glow-node:nth-child(2) {
      top: 39%;
      left: 83%;
    }

    .work-glow-node:nth-child(3) {
      top: 78%;
      left: 71%;
    }

    .work-glow-node:nth-child(4) {
      top: 78%;
      left: 29%;
    }

    .work-glow-node:nth-child(5) {
      top: 39%;
      left: 17%;
    }

    .work-glow-node:nth-child(6) {
      top: 52%;
      left: 50%;
      width: 82px;
      height: 82px;
      background: radial-gradient(circle at center,
          rgb(217 245 106 / 58%) 0%,
          rgb(190 235 79 / 32%) 42%,
          rgb(174 234 85 / 0%) 76%);
      filter: blur(11px);
    }

    .work-spark-glow {
      width: 104px;
      height: 118px;
    }

    .work-spark-glow::before,
    .work-spark-glow::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
          rgb(217 245 106 / 40%) 0%,
          rgb(190 235 79 / 24%) 42%,
          rgb(174 234 85 / 0%) 80%);
      filter: blur(12px);
      transform: translate(-50%, -50%);
    }

    .work-spark-glow::before {
      width: 24px;
      height: 104px;
    }

    .work-spark-glow::after {
      width: 92px;
      height: 22px;
    }

    .fragment-particle {
      --fragment-glow-opacity: 0;
      --magnetic-glow: 0;
      --magnetic-x: 0px;
      --magnetic-y: 0px;
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }



    .fragment-particle::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 50%;
      left: 50%;
      width: 42px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
          rgb(217 245 106 / 45%) 0%,
          rgb(190 235 79 / 28%) 38%,
          rgb(174 234 85 / 10%) 65%,
          rgb(174 234 85 / 0%) 100%);
      filter: blur(8px);
      opacity: var(--fragment-glow-opacity);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .fragment-char {
      position: relative;
      z-index: 1;
      display: block;
      color: #65bceb;
      font-family: Consolas, "Lucida Console", "DejaVu Sans Mono", monospace;
      font-size: clamp(16px, 1.25vw, 24px);
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
    }

    .fragment-group.is-idle .fragment-char {
      animation: fragment-idle-drift var(--idle-duration) ease-in-out
        var(--idle-delay) infinite both;
    }

    .fragment-group.is-idle .fragment-particle::before {
      animation: fragment-glow-breathe var(--idle-glow-duration) ease-in-out
        var(--idle-delay) infinite both;
    }

    .fragment-group.is-hovered .fragment-char,
    .fragment-group.is-hovered .fragment-particle::before {
      animation-play-state: paused;
    }

    @keyframes fragment-idle-drift {
      0%,
      100% {
        transform: translate(var(--magnetic-x), var(--magnetic-y));
      }

      22% {
        transform: translate(
          calc(var(--idle-x) + var(--magnetic-x)),
          calc(var(--idle-y-neg-45) + var(--magnetic-y))
        );
      }

      52% {
        transform: translate(
          calc(var(--idle-x-neg-50) + var(--magnetic-x)),
          calc(var(--idle-y) + var(--magnetic-y))
        );
      }

      78% {
        transform: translate(
          calc(var(--idle-x-neg) + var(--magnetic-x)),
          calc(var(--idle-y-neg-35) + var(--magnetic-y))
        );
      }
    }

    @keyframes fragment-glow-breathe {
      0%,
      100% {
        filter: blur(8px) brightness(calc(0.94 + var(--magnetic-glow)));
      }

      50% {
        filter: blur(8px) brightness(calc(1.06 + var(--magnetic-glow)));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fragment-group.is-idle .fragment-char,
      .fragment-group.is-idle .fragment-particle::before {
        animation: none;
      }
    }

    .module-hit-area {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      padding: 0;
      background: transparent;
      border: 0;
      opacity: 0;
      pointer-events: none;
      cursor: default;
      transform: translate(-50%, -50%);
    }

    .module-hit-area.is-interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    .module-label {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      color: #355b6b;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-style: italic;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.035em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition:
        opacity 200ms ease,
        transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .module-label.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .module-label.is-resetting {
      transition: none;
    }

    .debug-panel {
      display: none;
      position: fixed;
      z-index: 4;
      top: 16px;
      left: 16px;
      margin: 0;
      padding: 10px 12px;
      color: #17455d;
      background: rgb(244 243 237 / 90%);
      border: 1px solid rgb(23 69 93 / 18%);
      font-size: 13px;
      line-height: 1.55;
    }

    .debug-toggle {
      display: block;
      margin-top: 8px;
      padding: 4px 7px;
      color: inherit;
      background: transparent;
      border: 1px solid rgb(23 69 93 / 30%);
      border-radius: 0;
      font: inherit;
      cursor: pointer;
    }

    .debug-legend {
      display: none;
      margin-top: 7px;
      font-size: 11px;
    }

    body.debug-visible .debug-legend {
      display: block;
    }

    .debug-markers {
      z-index: 3;
      display: none;
    }

    body.debug-visible .debug-markers {
      display: block;
    }

    .path-marker {
      position: absolute;
      width: 5px;
      height: 5px;
      margin: -2.5px 0 0 -2.5px;
      border-radius: 50%;
    }

    .path-marker--start {
      background: #9ddcf4;
    }

    .path-marker--disperse {
      background: #55b5df;
    }

    .path-marker--target {
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      background: #2697d4;
    }
  </style>
</head>

<body>
  <main class="scroll-track" aria-label="About fragment scroll animation test">
    <section class="sticky-stage">
      <div id="hand-frame" class="hand-frame" role="img" aria-label="Hands opening from a fist">
        <img
          class="hand-frame__image is-active"
          src="public/assets/hands/hand_01.webp"
          width="1920"
          height="1080"
          alt=""
          aria-hidden="true"
          draggable="false"
        />
      </div>

      <h1 id="display-name" class="display-name" aria-label="Yingru Zhao">
        <span class="display-name-line display-name-line--top" aria-hidden="true">
          <span id="display-name-primary" class="display-name-primary">#1×+·0</span>
        </span>
        <span class="display-name-line display-name-line--bottom" aria-hidden="true">
          <span id="display-name-secondary" class="display-name-secondary">×#01</span>
        </span>
      </h1>

      <nav
        id="home-navigation"
        class="site-nav home-navigation"
        aria-label="Primary navigation"
        aria-hidden="true"
      >
        <a class="site-nav__item" href="about.html">ABOUT</a>
        <a class="site-nav__item" href="work.html">WORK</a>
        <a class="site-nav__item" href="lab.html">LAB</a>
      </nav>
      <div class="top-navigation-rule" aria-hidden="true"></div>

      <div id="scroll-hint" class="scroll-hint" aria-hidden="true">
        <span id="scroll-hint-text" class="scroll-hint__text">#1×+·01×</span>
        <span id="scroll-hint-arrow" class="scroll-hint__arrow" aria-hidden="true">↓</span>
      </div>

      <div id="about-star-glow" class="symbol-glow four-point-glow" aria-hidden="true">
        <span class="symbol-glow__core"></span>
      </div>

      <div id="work-main-glow" class="symbol-glow work-main-glow" aria-hidden="true">
        <span class="work-glow-node"></span>
        <span class="work-glow-node"></span>
        <span class="work-glow-node"></span>
        <span class="work-glow-node"></span>
        <span class="work-glow-node"></span>
        <span class="work-glow-node"></span>
      </div>

      <div id="work-spark-glow" class="symbol-glow work-spark-glow" aria-hidden="true"></div>

      <div id="lab-star-glow" class="symbol-glow lab-five-glow" aria-hidden="true">
        <span class="lab-glow-node"></span>
        <span class="lab-glow-node"></span>
        <span class="lab-glow-node"></span>
        <span class="lab-glow-node"></span>
        <span class="lab-glow-node"></span>
        <span class="lab-glow-node"></span>
      </div>

      <div id="fragment-layer" class="fragment-layer" aria-hidden="true">
        <div class="fragment-group" data-group="ambient"></div>
        <div class="fragment-group" data-group="about"></div>
        <div class="fragment-group" data-group="work"></div>
        <div class="fragment-group" data-group="lab"></div>
      </div>

      <div id="about-hit-area" class="module-hit-area" aria-hidden="true"></div>
      <div id="work-hit-area" class="module-hit-area" aria-hidden="true"></div>
      <div id="lab-hit-area" class="module-hit-area" aria-hidden="true"></div>

      <div id="about-label" class="module-label" aria-hidden="true">#1×+·</div>
      <div id="work-label" class="module-label" aria-hidden="true">#×01</div>
      <div id="lab-label" class="module-label" aria-hidden="true">×#1</div>

      <div id="debug-markers" class="debug-markers" aria-hidden="true"></div>
    </section>
  </main>

  <aside class="debug-panel" aria-live="polite">
    Frame: <span id="frame-value">01 / 20</span><br />
    Overall Progress: <span id="progress-value">0%</span><br />
    Hand Progress: <span id="hand-progress-value">0%</span><br />
    Fragment Progress: <span id="fragment-progress-value">0%</span><br />
    Stage: <span id="stage-value">RELEASE</span>
    <button id="debug-toggle" class="debug-toggle" type="button" aria-pressed="false">
      Show path points
    </button>
    <span class="debug-legend">
      Light: start · Mid: disperse · Dark: target
    </span>
  </aside>

  <script>
    (() => {
      const FRAME_COUNT = 20;
      const FRAME_ROOT = "public/assets/hands";
      const SMOOTHING_FACTOR = 0.12;
      const MAX_PROGRESS_STEP = 1 / (FRAME_COUNT - 1);
      const SETTLE_EPSILON = 0.0001;
      const FRAGMENT_START = 0.62;
      const RELEASE_END = 0.3;
      const DISPERSE_END = 0.66;
      const FRAGMENT_TOP_BOUNDARY_GAP = 22;
      const STAR_TARGET_SCALE = 0.73;
      const PALM_VISIBILITY_START = 0.615;

      function canUseMagneticAttraction() {
        return (
          fragmentIdleEnabled &&
          magneticMediaQuery.matches &&
          !reducedMotionMediaQuery.matches
        );
      }

      function resetMagneticAttraction() {
        if (magneticFrameId !== null) {
          window.cancelAnimationFrame(magneticFrameId);
          magneticFrameId = null;
        }
        magneticPointer.active = false;
        fragmentGroups.forEach((group) => {
          group.fragments.forEach((fragment) => {
            if (!fragment.magneticState) return;
            fragment.magneticState.x = 0;
            fragment.magneticState.y = 0;
            fragment.magneticState.glow = 0;
          });
          group.elements.forEach((element) => {
            element.style.setProperty("--magnetic-x", "0px");
            element.style.setProperty("--magnetic-y", "0px");
            element.style.setProperty("--magnetic-glow", "0");
          });
        });
      }

      function requestMagneticFrame() {
        if (magneticFrameId !== null || !canUseMagneticAttraction()) return;
        magneticFrameId = window.requestAnimationFrame(renderMagneticAttraction);
      }

      function renderMagneticAttraction() {
        magneticFrameId = null;
        if (!canUseMagneticAttraction()) {
          resetMagneticAttraction();
          return;
        }

        let shouldContinue = false;

        fragmentGroups.forEach((group) => {
          const groupCenter = group.centerPoint;
          const groupDistance = magneticPointer.active
            ? Math.hypot(
              magneticPointer.x - groupCenter.x,
              magneticPointer.y - groupCenter.y,
            )
            : PROXIMITY_RADIUS;
          const groupInfluence =
            activeModuleId === group.id
              ? smoothstep((PROXIMITY_RADIUS - groupDistance) / PROXIMITY_RADIUS) * 0.4
              : smoothstep((PROXIMITY_RADIUS - groupDistance) / PROXIMITY_RADIUS);

          group.fragments.forEach((fragment, index) => {
            const state = fragment.magneticState;
            const element = group.elements[index];
            const points = group.pathPoints[index];
            let targetX = 0;
            let targetY = 0;
            let targetGlow = 0;

            if (groupInfluence > 0 && points) {
              const dx = magneticPointer.x - points.target.x;
              const dy = magneticPointer.y - points.target.y;
              const fragmentDistance = Math.max(1, Math.hypot(dx, dy));
              const fragmentInfluence =
                0.72 +
                (1 - smoothstep(fragmentDistance / PROXIMITY_RADIUS)) * 0.48;
              const amount =
                state.maxOffset *
                state.response *
                groupInfluence *
                fragmentInfluence;
              targetX = (dx / fragmentDistance) * amount;
              targetY = (dy / fragmentDistance) * amount;
              targetGlow = groupInfluence * 0.16;
            }

            state.x += (targetX - state.x) * MAGNETIC_SMOOTHING;
            state.y += (targetY - state.y) * MAGNETIC_SMOOTHING;
            state.glow += (targetGlow - state.glow) * MAGNETIC_SMOOTHING;

            if (
              Math.abs(targetX - state.x) > MAGNETIC_EPSILON ||
              Math.abs(targetY - state.y) > MAGNETIC_EPSILON ||
              Math.abs(targetGlow - state.glow) > 0.002
            ) {
              shouldContinue = true;
            }

            if (
              targetX === 0 &&
              targetY === 0 &&
              targetGlow === 0 &&
              Math.abs(state.x) <= MAGNETIC_EPSILON &&
              Math.abs(state.y) <= MAGNETIC_EPSILON &&
              Math.abs(state.glow) <= 0.002
            ) {
              state.x = 0;
              state.y = 0;
              state.glow = 0;
            }

            element.style.setProperty("--magnetic-x", `${state.x.toFixed(2)}px`);
            element.style.setProperty("--magnetic-y", `${state.y.toFixed(2)}px`);
            element.style.setProperty("--magnetic-glow", state.glow.toFixed(3));
          });
        });

        if (shouldContinue) {
          magneticFrameId = window.requestAnimationFrame(renderMagneticAttraction);
        }
      }

      function handlePointerMove(event) {
        if (!canUseMagneticAttraction()) return;
        magneticPointer.active = true;
        magneticPointer.x = event.clientX;
        magneticPointer.y = event.clientY;
        requestMagneticFrame();
      }

      function handlePointerLeave() {
        if (!canUseMagneticAttraction()) return;
        magneticPointer.active = false;
        requestMagneticFrame();
      }

      function setExploreInteractionsEnabled(enabled) {
        if (enabled === exploreInteractionsEnabled) return;
        exploreInteractionsEnabled = enabled;
        moduleInteractions.forEach((module) => {
          module.hitArea.classList.toggle("is-interactive", enabled);
          module.hitArea.setAttribute("aria-hidden", String(!enabled));
        });
        if (enabled) return;

        activeModuleId = null;
        moduleInteractions.forEach((module) => {
          deactivateModule(module, true);
        });
      }

      function getModuleHoverOffset(group, fragment, index) {
        const module = moduleInteractions.find(
          (candidate) => candidate.id === group.id,
        );
        if (!module || module.hoverProgress <= 0) return { x: 0, y: 0 };

        let x = fragment.target[0];
        let y = fragment.target[1];
        let maxDistance = ABOUT_MAX_TARGET_DISTANCE;
        let minDisplacement = 1.25;
        let displacementRange = 6;
        let displacementCap = 8;
        let extraX = 0;
        let extraY = 0;
        let tangentialAmount = 0;

        if (group.id === "work") {
          if (index >= WORK_MAIN_FRAGMENT_COUNT) {
            x -= WORK_SPARK_CENTER[0];
            y -= WORK_SPARK_CENTER[1];
            maxDistance = WORK_SPARK_MAX_TARGET_DISTANCE;
            minDisplacement = 1;
            displacementRange = 2;
            displacementCap = 3;
            extraX = 5;
            extraY = -4;
          } else {
            maxDistance = WORK_MAIN_MAX_TARGET_DISTANCE;
            minDisplacement = 1;
            displacementRange = 5.5;
            displacementCap = 7;
          }
        } else if (group.id === "lab") {
          [x, y] = rotatePoint(fragment.target, group.structureRotation);
          maxDistance = LAB_MAX_TARGET_DISTANCE;
          minDisplacement = 1;
          displacementRange = 4.5;
          displacementCap = 6;
        }

        const distance = Math.hypot(x, y);
        if (distance <= 0) {
          return {
            x: extraX * module.hoverProgress,
            y: extraY * module.hoverProgress,
          };
        }
        const distanceRatio = clamp01(distance / maxDistance);
        const variation = (((index * 5) % 7) - 3) * 0.22;
        const radialAmount = Math.min(
          displacementCap,
          Math.max(
            1,
            minDisplacement + distanceRatio * displacementRange + variation,
          ),
        );
        if (group.id === "lab") {
          tangentialAmount = Math.min(3, 1 + distanceRatio * 2);
        }
        const radialX = x / distance;
        const radialY = y / distance;
        const tangentX = -radialY;
        const tangentY = radialX;
        return {
          x:
            (radialX * radialAmount +
              tangentX * tangentialAmount +
              extraX) * module.hoverProgress,
          y:
            (radialY * radialAmount +
              tangentY * tangentialAmount +
              extraY) * module.hoverProgress,
        };
      }
      function getIndividualGlowOpacity(localProgress) {
        if (localProgress <= 0.08) return 0;

        if (localProgress <= 0.3) {
          return mix(
            0,
            0.18,
            smoothstep((localProgress - 0.08) / 0.22)
          );
        }

        if (localProgress <= 0.66) {
          return mix(
            0.18,
            0.28,
            smoothstep((localProgress - 0.3) / 0.36)
          );
        }

        return 0.28;
      }

      function getCharacterOpacity(overallProgress, visibilityRank) {
        if (visibilityRank < PALM_EARLY_COUNT) {
          const visibilityStart =
            PALM_VISIBILITY_START +
            (visibilityRank / Math.max(1, PALM_EARLY_COUNT - 1)) * 0.012;
          return smoothstep(
            (overallProgress - visibilityStart) /
            Math.max(0.001, PALM_VISIBLE_BY - visibilityStart),
          );
        }

        if (visibilityRank < PALM_CLUSTER_COUNT) {
          const clusterRank = visibilityRank - PALM_EARLY_COUNT;
          const clusterCount = PALM_CLUSTER_COUNT - PALM_EARLY_COUNT;
          const visibilityStart =
            0.638 + (clusterRank / Math.max(1, clusterCount - 1)) * 0.012;
          return smoothstep(
            (overallProgress - visibilityStart) /
            Math.max(0.001, PALM_CLUSTER_FILLED_BY - visibilityStart),
          );
        }

        const remainingCount = Math.max(
          1,
          TOTAL_FRAGMENT_COUNT - PALM_CLUSTER_COUNT - 1,
        );
        const lateRank = visibilityRank - PALM_CLUSTER_COUNT;
        const visibilityStart = 0.665 + (lateRank / remainingCount) * 0.045;
        return smoothstep((overallProgress - visibilityStart) / 0.025);
      }

      function rotatePoint(point, angleInDegrees) {
        const angle = (angleInDegrees * Math.PI) / 180;
        const cosine = Math.cos(angle);
        const sine = Math.sin(angle);
        return [
          point[0] * cosine - point[1] * sine,
          point[0] * sine + point[1] * cosine,
        ];
      }

      function quadraticPoint(start, control, end, progress) {
        const inverse = 1 - progress;
        return {
          x:
            inverse * inverse * start.x +
            2 * inverse * progress * control.x +
            progress * progress * end.x,
          y:
            inverse * inverse * start.y +
            2 * inverse * progress * control.y +
            progress * progress * end.y,
        };
      }

      function getScrollProgress() {
        const scrollRange = document.documentElement.scrollHeight - window.innerHeight;
        if (scrollRange <= 0) return 0;
        return clamp01(window.scrollY / scrollRange);
      }

      function getFragmentProgress(progress) {
        return clamp01((progress - FRAGMENT_START) / (1 - FRAGMENT_START));
      }

      function initializeFragmentGroups() {
        fragmentGroups.forEach((group, groupIndex) => {
          group.container = document.querySelector(`[data-group="${group.id}"]`);
          const module = moduleInteractions.find(
            (candidate) => candidate.id === group.id,
          );
          module.fragmentContainer = group.container;
          group.elements = group.fragments.map((fragment, index) => {
            const particle = document.createElement("span");
            particle.className = "fragment-particle";
            particle.dataset.group = group.id;
            const seed = groupIndex * 53 + index + 1;
            const amplitudeX = seed % 13 === 0
              ? 5.7
              : 2 + ((seed * 7) % 31) / 10;
            const amplitudeY = seed % 11 === 0
              ? 5.8
              : 2 + ((seed * 11) % 31) / 10;
            const directionX = seed % 2 === 0 ? 1 : -1;
            const directionY = seed % 3 === 0 ? -1 : 1;
            fragment.magneticState = {
              x: 0,
              y: 0,
              glow: 0,
              maxOffset: seed % 17 === 0
                ? 13.4
                : 6 + ((seed * 23) % 41) / 10,
              response: 0.78 + ((seed * 29) % 45) / 100,
            };
            particle.style.setProperty(
              "--idle-x",
              `${(amplitudeX * directionX).toFixed(1)}px`,
            );
            particle.style.setProperty(
              "--idle-y",
              `${(amplitudeY * directionY).toFixed(1)}px`,
            );
            particle.style.setProperty(
              "--idle-x-neg",
              `${(amplitudeX * directionX * -1).toFixed(2)}px`,
            );
            particle.style.setProperty(
              "--idle-x-neg-50",
              `${(amplitudeX * directionX * -0.5).toFixed(2)}px`,
            );
            particle.style.setProperty(
              "--idle-y-neg-45",
              `${(amplitudeY * directionY * -0.45).toFixed(2)}px`,
            );
            particle.style.setProperty(
              "--idle-y-neg-35",
              `${(amplitudeY * directionY * -0.35).toFixed(2)}px`,
            );
            particle.style.setProperty(
              "--idle-duration",
              `${(3.8 + ((seed * 13) % 33) / 10).toFixed(1)}s`,
            );
            particle.style.setProperty(
              "--idle-glow-duration",
              `${(4.4 + ((seed * 17) % 27) / 10).toFixed(1)}s`,
            );
            particle.style.setProperty(
              "--idle-delay",
              `${450 + ((seed * 19) % 7) * 70}ms`,
            );
            const character = document.createElement("span");
            character.className = "fragment-char";
            character.textContent = fragment.char;
            particle.append(character);
            group.container.append(particle);
            return particle;
          });
          group.glows.forEach((glow) => {
            glow.element = document.querySelector(`#${glow.elementId}`);
          });
          group.pathPoints = [];
        });

        ambientElements = ambientFragments.map((fragment) => {
          const particle = document.createElement("span");
          particle.className = "fragment-particle";
          particle.dataset.group = "ambient";
          const character = document.createElement("span");
          character.className = "fragment-char";
          character.textContent = fragment.char;
          particle.append(character);
          ambientContainer.append(particle);
          return particle;
        });

        let visibilityRank = 0;
        const maxGroupSize = Math.max(
          ...fragmentGroups.map((group) => group.fragments.length),
        );
        for (let index = 0; index < maxGroupSize; index += 1) {
          fragmentGroups.forEach((group) => {
            if (!group.fragments[index]) return;
            group.fragments[index].visibilityRank = visibilityRank;
            visibilityRank += 1;
          });
        }
      }

      function calculatePathPoints() {
        const imageRect = frameElement.getBoundingClientRect();
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const starScale = Math.min(viewportWidth / 1440, viewportHeight / 900);
        const navigationRuleRect = topNavigationRule.getBoundingClientRect();
        const navigationRuleBottom = Math.max(
          navigationRuleRect.bottom,
          topNavigationRule.offsetTop + navigationRuleRect.height,
        );
        fragmentTopBoundary = navigationRuleBottom + FRAGMENT_TOP_BOUNDARY_GAP;

        fragmentGroups.forEach((group) => {
          // Desktop-first safety margins prevent any symbol center from
          // reaching an edge while preserving the configured vw/vh layout.
          const center = {
            x: Math.min(viewportWidth - 130, Math.max(130, viewportWidth * group.center[0])),
            y: Math.min(viewportHeight - 140, Math.max(130, viewportHeight * group.center[1])),
          };
          group.centerPoint = center;

          group.glows.forEach((glow) => {
            const glowX =
              center.x +
              glow.offset[0] * starScale * STAR_TARGET_SCALE * group.scale;
            const glowY =
              center.y +
              glow.offset[1] * starScale * STAR_TARGET_SCALE * group.scale;
            glow.element.style.left = `${glowX}px`;
            glow.element.style.top = `${glowY}px`;
            glow.element.style.setProperty(
              "--glow-scale",
              (starScale * glow.scale).toFixed(4),
            );
          });

          group.pathPoints = group.fragments.map((fragment) => {
            const palm = PALMS[fragment.palm];
            const sourceX = palm.x + fragment.start[0];
            const sourceY = palm.y + fragment.start[1];
            const target = group.structureRotation
              ? rotatePoint(fragment.target, group.structureRotation)
              : fragment.target;
            return {
              start: {
                x: imageRect.left + (sourceX / SOURCE_SIZE.width) * imageRect.width,
                y: imageRect.top + (sourceY / SOURCE_SIZE.height) * imageRect.height,
              },
              disperse: (() => {
                const isAbout = group.id === "about";
                const x = isAbout
                  ? Math.min(0.92, Math.max(0.10, 0.5 +
                    (fragment.disperse[0] - 0.5) * ABOUT_DISPERSE_HORIZONTAL_EXPANSION))
                  : fragment.disperse[0];
                const y = isAbout
                  ? Math.min(0.68, Math.max(0.08, 0.4 +
                    (fragment.disperse[1] - 0.4) * ABOUT_DISPERSE_VERTICAL_EXPANSION))
                  : fragment.disperse[1];
                return {
                  x: viewportWidth * x,
                  y: Math.max(fragmentTopBoundary, viewportHeight * y),
                };
              })(),
              target: {
                x:
                  center.x +
                  target[0] * starScale * STAR_TARGET_SCALE * group.scale,
                y:
                  center.y +
                  target[1] * starScale * STAR_TARGET_SCALE * group.scale,
              },
            };
          });
        });

        ambientPathPoints = ambientFragments.map((fragment) => {
          const palm = PALMS[fragment.palm];
          return {
            start: {
              x: imageRect.left +
                ((palm.x + fragment.start[0]) / SOURCE_SIZE.width) * imageRect.width,
              y: imageRect.top +
                ((palm.y + fragment.start[1]) / SOURCE_SIZE.height) * imageRect.height,
            },
            disperse: {
              x: viewportWidth * fragment.disperse[0],
              y: Math.max(fragmentTopBoundary, viewportHeight * fragment.disperse[1]),
            },
          };
        });

        moduleInteractions.forEach((module) => {
          const group = fragmentGroups.find(
            (candidate) => candidate.id === module.id,
          );
          const maxHorizontalDistance = Math.max(
            ...group.pathPoints.map((points) =>
              Math.abs(points.target.x - group.centerPoint.x),
            ),
          );
          const maxVerticalDistance = Math.max(
            ...group.pathPoints.map((points) =>
              Math.abs(points.target.y - group.centerPoint.y),
            ),
          );
          module.hitArea.style.left = `${group.centerPoint.x}px`;
          module.hitArea.style.top = `${group.centerPoint.y}px`;
          module.hitArea.style.width = `${Math.ceil(maxHorizontalDistance * 2 + 56)}px`;
          module.hitArea.style.height = `${Math.ceil(maxVerticalDistance * 2 + 56)}px`;
          module.label.style.left = `${group.centerPoint.x + module.labelOffset[0] * starScale
            }px`;
          module.label.style.top = `${group.centerPoint.y + module.labelOffset[1] * starScale
            }px`;
        });

        updateDebugMarkers();
      }

      function createDebugMarkers() {
        const markerTypes = ["start", "disperse", "target"];
        fragmentGroups.forEach((group) => {
          group.fragments.forEach((_, index) => {
            markerTypes.forEach((type) => {
              const marker = document.createElement("span");
              marker.className = `path-marker path-marker--${type}`;
              marker.dataset.group = group.id;
              marker.dataset.fragment = String(index);
              marker.dataset.point = type;
              marker.title = `${group.id} ${index + 1}: ${type}`;
              debugMarkers.append(marker);
            });
          });
        });
      }

      function updateDebugMarkers() {
        debugMarkers.querySelectorAll(".path-marker").forEach((marker) => {
          const group = fragmentGroups.find(
            (candidate) => candidate.id === marker.dataset.group,
          );
          const index = Number(marker.dataset.fragment);
          const point = group.pathPoints[index][marker.dataset.point];
          marker.style.transform = `translate(${Math.round(point.x)}px, ${Math.round(point.y)}px)`;
        });
      }

      function renderFrame(progress) {
        const nextFrameIndex = Math.round(progress * (FRAME_COUNT - 1));
        if (nextFrameIndex !== currentFrameIndex) {
          frameElements[currentFrameIndex].classList.remove("is-active");
          currentFrameIndex = nextFrameIndex;
          frameElements[currentFrameIndex].classList.add("is-active");
          frameValue.textContent = `${String(currentFrameIndex + 1).padStart(2, "0")} / 20`;
        }
      }

      function getStage(fragmentProgress) {
        if (fragmentProgress < RELEASE_END) return "RELEASE";
        if (fragmentProgress < DISPERSE_END) return "DISPERSE";
        return "FORM";
      }

      function renderFragments(progress) {
        const fragmentProgress = getFragmentProgress(progress);
        fragmentProgressValue.textContent = `${Math.round(fragmentProgress * 100)}%`;
        stageValue.textContent = getStage(fragmentProgress);

        const aboutGroup = fragmentGroups.find((group) => group.id === "about");
        const aboutGroupProgress = clamp01(
          (fragmentProgress - aboutGroup.groupDelay) /
          (1 - aboutGroup.groupDelay),
        );
        setExploreInteractionsEnabled(
          aboutGroupProgress >= ABOUT_INTERACTIVE_THRESHOLD,
        );
        const allGroupsFormed = fragmentGroups.every((group) => {
          const groupProgress = clamp01(
            (fragmentProgress - group.groupDelay) / (1 - group.groupDelay),
          );
          return groupProgress >= ABOUT_INTERACTIVE_THRESHOLD;
        });
        homeNavigation.classList.toggle("is-visible", allGroupsFormed);
        homeNavigation.setAttribute("aria-hidden", String(!allGroupsFormed));
        setFragmentIdleEnabled(allGroupsFormed);

        fragmentGroups.forEach((group) => {
          const groupProgress = clamp01(
            (fragmentProgress - group.groupDelay) / (1 - group.groupDelay),
          );
          const glowProgress = smoothstep(
            (groupProgress - DISPERSE_END) / (1 - DISPERSE_END),
          );
          group.glows.forEach((glow) => {
            glow.element.style.opacity = (glowProgress * glow.opacity).toFixed(3);
          });

          group.fragments.forEach((fragment, index) => {
            const points = group.pathPoints[index];
            const curve = group.id === "about"
              ? fragment.curve * ABOUT_CURVE_MULTIPLIER
              : fragment.curve;
            const localProgress = clamp01(
              (groupProgress - fragment.delay) / (1 - fragment.delay),
            );
            const releasePoint = {
              x: mix(points.start.x, points.disperse.x, 0.38),
              y: mix(points.start.y, points.disperse.y, 0.38),
            };
            let point;
            let rotation;
            let scale;

            if (localProgress <= RELEASE_END) {
              const stageProgress = smoothstep(localProgress / RELEASE_END);
              const control = {
                x: mix(points.start.x, releasePoint.x, 0.45) + curve,
                y: Math.max(
                  fragmentTopBoundary,
                  Math.min(points.start.y, releasePoint.y) - 24,
                ),
              };
              point = quadraticPoint(points.start, control, releasePoint, stageProgress);
              rotation = mix(fragment.flightRotation * 0.35, fragment.flightRotation, stageProgress);
              scale = mix(fragment.startScale, 0.92, stageProgress);
            } else if (localProgress <= DISPERSE_END) {
              const stageProgress = smoothstep(
                (localProgress - RELEASE_END) / (DISPERSE_END - RELEASE_END),
              );
              const control = {
                x: mix(releasePoint.x, points.disperse.x, 0.5) + curve,
                y: Math.max(
                  fragmentTopBoundary,
                  Math.min(releasePoint.y, points.disperse.y) - 34,
                ),
              };
              point = quadraticPoint(releasePoint, control, points.disperse, stageProgress);
              rotation = mix(fragment.flightRotation, fragment.flightRotation * 0.55, stageProgress);
              scale = mix(0.92, 1, stageProgress);
            } else {
              const stageProgress = smoothstep(
                (localProgress - DISPERSE_END) / (1 - DISPERSE_END),
              );
              const control = {
                x: mix(points.disperse.x, points.target.x, 0.52) - curve * 0.65,
                y: Math.max(
                  fragmentTopBoundary,
                  mix(points.disperse.y, points.target.y, 0.48) - 18,
                ),
              };
              point = quadraticPoint(points.disperse, control, points.target, stageProgress);
              rotation = mix(fragment.flightRotation * 0.55, fragment.targetRotation, stageProgress);
              scale = mix(1, fragment.targetScale, stageProgress);
            }

            const opacity = getCharacterOpacity(
              progress,
              fragment.visibilityRank,
            );
            const fragmentGlowOpacity = getIndividualGlowOpacity(localProgress);
            const hoverOffset = getModuleHoverOffset(group, fragment, index);
            point.x += hoverOffset.x;
            point.y += hoverOffset.y;
            const x = Math.round(point.x * 4) / 4;
            const y = Math.round(point.y * 4) / 4;
            group.elements[index].style.opacity = opacity.toFixed(3);
            group.elements[index].style.setProperty(
              "--fragment-glow-opacity",
              fragmentGlowOpacity.toFixed(3),
            );
            group.elements[index].style.transform =
              `translate(${x}px, ${y}px) translate(-50%, -50%) ` +
              `rotate(${rotation.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
          });
        });

        const ambientAppearance = smoothstep(
          (progress - PALM_VISIBILITY_START) /
          (PALM_VISIBLE_BY - PALM_VISIBILITY_START),
        );
        const ambientFade = fragmentProgress <= DISPERSE_END
          ? 1
          : 1 - smoothstep((fragmentProgress - DISPERSE_END) / 0.28);

        ambientFragments.forEach((fragment, index) => {
          const points = ambientPathPoints[index];
          const localProgress = clamp01(
            (fragmentProgress - fragment.delay) /
            Math.max(0.001, DISPERSE_END - fragment.delay),
          );
          const releasePoint = {
            x: mix(points.start.x, points.disperse.x, 0.40),
            y: mix(points.start.y, points.disperse.y, 0.40),
          };
          let point;
          let rotation;
          let scale;

          if (localProgress <= RELEASE_END) {
            const stageProgress = smoothstep(localProgress / RELEASE_END);
            const control = {
              x: mix(points.start.x, releasePoint.x, 0.46) + fragment.curve,
              y: Math.max(
                fragmentTopBoundary,
                Math.min(points.start.y, releasePoint.y) - 28,
              ),
            };
            point = quadraticPoint(points.start, control, releasePoint, stageProgress);
            rotation = mix(fragment.flightRotation * 0.3, fragment.flightRotation, stageProgress);
            scale = mix(fragment.startScale, fragment.disperseScale * 0.88, stageProgress);
          } else {
            const stageProgress = smoothstep(
              (localProgress - RELEASE_END) / (DISPERSE_END - RELEASE_END),
            );
            const control = {
              x: mix(releasePoint.x, points.disperse.x, 0.52) + fragment.curve,
              y: Math.max(
                fragmentTopBoundary,
                Math.min(releasePoint.y, points.disperse.y) - 38,
              ),
            };
            point = quadraticPoint(releasePoint, control, points.disperse, stageProgress);
            rotation = mix(fragment.flightRotation, fragment.flightRotation * 0.48, stageProgress);
            scale = mix(fragment.disperseScale * 0.88, fragment.disperseScale, stageProgress);
          }

          const opacity = ambientAppearance * ambientFade;
          const x = Math.round(point.x * 4) / 4;
          const y = Math.round(point.y * 4) / 4;
          ambientElements[index].style.opacity = opacity.toFixed(3);
          ambientElements[index].style.setProperty(
            "--fragment-glow-opacity",
            (getIndividualGlowOpacity(localProgress) * 0.85).toFixed(3),
          );
          ambientElements[index].style.transform =
            `translate(${x}px, ${y}px) translate(-50%, -50%) ` +
            `rotate(${rotation.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
        });
      }

      function renderProgress(progress) {
        renderFrame(progress);
        renderFragments(progress);
        handProgressValue.textContent = `${Math.round(progress * 100)}%`;
      }

      function scrubTowardTarget() {
        scrubFrameId = null;
        const difference = targetProgress - currentProgress;
        if (Math.abs(difference) <= SETTLE_EPSILON) {
          currentProgress = targetProgress;
          renderProgress(currentProgress);
          return;
        }

        const lerpedStep = difference * SMOOTHING_FACTOR;
        const progressStep =
          Math.sign(lerpedStep) *
          Math.min(Math.abs(lerpedStep), MAX_PROGRESS_STEP);
        currentProgress = clamp01(currentProgress + progressStep);
        renderProgress(currentProgress);
        scrubFrameId = window.requestAnimationFrame(scrubTowardTarget);
      }

      function requestScrub() {
        targetProgress = getScrollProgress();
        progressValue.textContent = `${Math.round(targetProgress * 100)}%`;
        if (!introComplete || scrubFrameId !== null) return;
        scrubFrameId = window.requestAnimationFrame(scrubTowardTarget);
      }

      function startEntrance() {
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(() => {
            frameElement.classList.add("is-entering");
          });
        });
      }

      function resolveDisplayNameText(finalText, progress, noiseStep) {
        const lockedCount = Math.min(
          finalText.length,
          Math.floor(progress * (finalText.length + 1)),
        );
        return finalText
          .split("")
          .map((letter, index) => {
            if (index < lockedCount) return letter;
            return ABOUT_DECODE_CHARACTERS[
              (noiseStep + index * 2) % ABOUT_DECODE_CHARACTERS.length
            ];
          })
          .join("");
      }

      function startDisplayNameDecode() {
        const startedAt = performance.now();

        const renderDisplayNameDecode = (timestamp) => {
          const progress = clamp01(
            (timestamp - startedAt) / DISPLAY_NAME_DECODE_DURATION,
          );
          const noiseStep = Math.floor((timestamp - startedAt) / 64);
          displayNamePrimary.textContent = resolveDisplayNameText(
            "Yingru",
            progress,
            noiseStep,
          );
          displayNameSecondary.textContent = resolveDisplayNameText(
            "Zhao",
            progress,
            noiseStep + 2,
          );
          if (displayNamePrimary.textContent.startsWith("Y")) {
            displayName.classList.add("has-art-y");
          }

          if (progress >= 1) {
            displayNamePrimary.textContent = "Yingru";
            displayNameSecondary.textContent = "Zhao";
            return;
          }
          window.requestAnimationFrame(renderDisplayNameDecode);
        };

        window.requestAnimationFrame(renderDisplayNameDecode);
      }

      function startNameEntrance() {
        if (displayNameEntranceStarted) return;
        displayNameEntranceStarted = true;
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(() => {
            displayName.classList.add("is-entering");
            topNavigationRule.classList.add("is-entering");
            window.setTimeout(
              startDisplayNameDecode,
              DISPLAY_NAME_DECODE_DELAY,
            );
            scheduleScrollHint();
          });
        });
      }

      function startScrollHintDecode() {
        if (scrollHintConsumed || scrollHintStarted) return;
        scrollHintStarted = true;
        scrollHint.setAttribute("aria-hidden", "false");
        scrollHint.classList.add("is-visible");
        const startedAt = performance.now();

        const renderScrollHintDecode = (timestamp) => {
          if (scrollHintConsumed) {
            scrollHintAnimationId = null;
            return;
          }
          const progress = clamp01(
            (timestamp - startedAt) / SCROLL_HINT_DECODE_DURATION,
          );
          const noiseStep = Math.floor((timestamp - startedAt) / 64);
          scrollHintText.textContent = resolveDisplayNameText(
            "Scroll To Release",
            progress,
            noiseStep,
          );
          if (progress >= SCROLL_HINT_ARROW_PROGRESS) {
            scrollHintArrow.classList.add("is-visible");
          }
          if (progress >= 1) {
            scrollHintText.textContent = "Scroll To Release";
            scrollHintAnimationId = null;
            return;
          }
          scrollHintAnimationId = window.requestAnimationFrame(
            renderScrollHintDecode,
          );
        };

        scrollHintAnimationId = window.requestAnimationFrame(
          renderScrollHintDecode,
        );
      }

      function scheduleScrollHint() {
        if (scrollHintConsumed || scrollHintStarted || scrollHintDelayId !== null) {
          return;
        }
        scrollHintDelayId = window.setTimeout(() => {
          scrollHintDelayId = null;
          startScrollHintDecode();
        }, SCROLL_HINT_INTRO_DELAY);
      }

      function consumeScrollHint() {
        if (scrollHintConsumed || window.scrollY <= SCROLL_HINT_THRESHOLD) return;
        scrollHintConsumed = true;
        if (scrollHintDelayId !== null) {
          window.clearTimeout(scrollHintDelayId);
          scrollHintDelayId = null;
        }
        if (scrollHintAnimationId !== null) {
          window.cancelAnimationFrame(scrollHintAnimationId);
          scrollHintAnimationId = null;
        }
        scrollHint.setAttribute("aria-hidden", "true");
        scrollHint.classList.add("is-consumed");
      }

      function handlePageScroll() {
        consumeScrollHint();
        requestScrub();
      }

      initializeFragmentGroups();
      createDebugMarkers();
      calculatePathPoints();
      renderFragments(0);

      moduleInteractions.forEach((module) => {
        module.hitArea.addEventListener("pointerenter", () => {
          activateModule(module);
        });
        module.hitArea.addEventListener("pointerleave", () => {
          if (activeModuleId !== module.id) return;
          activeModuleId = null;
          deactivateModule(module);
        });
        if (module.id === "about") {
          module.hitArea.addEventListener("click", () => {
            window.location.href = "about.html";
          });
        }
        if (module.id === "work") {
          module.hitArea.addEventListener("click", () => {
            window.location.href = "work.html";
          });
        }
        if (module.id === "lab") {
          module.hitArea.addEventListener("click", () => {
            window.location.href = "lab.html";
          });
        }
      });

      debugToggle.addEventListener("click", () => {
        const visible = document.body.classList.toggle("debug-visible");
        debugToggle.setAttribute("aria-pressed", String(visible));
        debugToggle.textContent = visible ? "Hide path points" : "Show path points";
      });

      frameElement.addEventListener(
        "transitionend",
        (event) => {
          if (event.propertyName !== "transform") return;
          frameElement.classList.add("is-settled");
          introComplete = true;
          calculatePathPoints();
          requestScrub();
        },
        { once: true },
      );

      Promise.all(
        frameElements.map(
          (image) =>
            new Promise((resolve, reject) => {
              if (image.complete && image.naturalWidth > 0) {
                resolve(image);
                return;
              }
              image.addEventListener("load", () => resolve(image), { once: true });
              image.addEventListener("error", reject, { once: true });
            }),
        ),
      )
        .then((images) =>
          Promise.all(images.map((image) => image.decode().catch(() => undefined))),
        )
        .then(() => {
          window.addEventListener("scroll", handlePageScroll, { passive: true });
          window.addEventListener("pointermove", handlePointerMove, { passive: true });
          window.addEventListener("pointerleave", handlePointerLeave);
          window.addEventListener("blur", handlePointerLeave);
          window.addEventListener("resize", () => {
            calculatePathPoints();
            renderProgress(currentProgress);
            requestScrub();
            requestMagneticFrame();
          });
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") handlePointerLeave();
          });
          console.info(`Preloaded ${FRAME_COUNT} hand animation frames.`);
          targetProgress = getScrollProgress();
          progressValue.textContent = `${Math.round(targetProgress * 100)}%`;
          startEntrance();
          startNameEntrance();
        })
        .catch((error) => {
          console.error("Hand frame preload failed.", error);
        });
    })();
  </script>
</body>

</html>
